[tox]
envlist = 
    py38-django42,
    py39-django{42,50},
    py310-django{42,50,51},
    py311-django{42,50,51},
    py312-django{42,50,51,52}

[testenv]
deps = 
    django42: Django>=4.2,<4.3
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<5.3
    pytest>=7.0
    pytest-django>=4.0
    pytest-cov>=4.0
    mock
commands = 
    pytest {posargs:tests}

[testenv:coverage]
deps = 
    {[testenv]deps}
    coverage[toml]>=7.0
commands = 
    coverage run -m pytest tests
    coverage report
    coverage html

[gh-actions]
python = 
    3.8: py38
    3.9: py39
    3.10: py310
    3.11: py311
    3.12: py312